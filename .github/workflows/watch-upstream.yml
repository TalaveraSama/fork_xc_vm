name: Watch upstream

# Opens an issue when Vateron-Media/XC_VM publishes a stable release newer
# than the version this fork ships, and says up front which of our patches
# that release collides with.
#
# Only stable releases count. Upstream keeps 2.5.x tagged as prereleases, and
# chasing those would mean rebasing this fork onto code its own authors have
# not called finished.

on:
  schedule:
    # Monday 06:00 UTC, after the binaries mirror has had its turn.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: Vateron-Media/XC_VM

jobs:
  check:
    name: Compare with upstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ours=$(sed -nE "s/.*define\('XC_VM_VERSION', *'([^']+)'\).*/\1/p" \
                 Core/Config/AppConfig.php | head -1)
          theirs=$(gh api "repos/$UPSTREAM/releases" \
                   --jq 'map(select(.prerelease == false and .draft == false))
                         | .[0].tag_name')

          echo "ours=$ours  upstream stable=$theirs"

          if [ -z "$theirs" ] || [ "$ours" = "$theirs" ]; then
            echo "Nothing newer to move to." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # This fork's number can sit ahead of upstream's -- 2.4.0 here while
          # their newest stable is 2.3.9. Plain inequality then fires every
          # week about a release already merged in this tree, and a weekly
          # false alarm is exactly how a real one ends up ignored.
          if [ "$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -1)" = "$ours" ]; then
            echo "Upstream stable $theirs is not newer than $ours." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="Upstream released $theirs (we ship $ours)"
          if gh issue list --state open --search "$title in:title" \
               --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already tracked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The list of files we patch is shared with build-release.yml. It
          # used to be seven paths hardcoded here, which had already fallen
          # behind the tree; reading the manifest is what keeps the two in step.
          manifest=.github/patched-upstream-files.txt
          if [ ! -s "$manifest" ]; then
            echo "::error::missing or empty $manifest"
            exit 1
          fi
          patched=$(grep -cvE '^[[:space:]]*(#|$)' "$manifest")
          echo "tracking $patched patched file(s)"

          # Which of our patches does that release actually touch? That is the
          # whole cost of the upgrade -- everything else merges cleanly.
          #
          # Asked per file by blob SHA, not by grepping the compare endpoint's
          # file list. That list is capped at 300 entries and does not
          # paginate, so across a wide gap it silently omits files -- and every
          # omission reads as "applies cleanly", which is the most expensive
          # direction to be wrong in. Measured on 2.3.9...2.5.3: the truncated
          # list reported one collision, the blob comparison found twelve.
          # Fifteen extra API calls buy an answer that is exact.
          stats=$(gh api "repos/$UPSTREAM/compare/$ours...$theirs" \
                  --jq '"\(.total_commits) commits, \(.files | length)\(if (.files|length) >= 300 then "+ (list truncated)" else "" end) files"')

          collisions=0
          : > /tmp/verdicts.txt
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in ''|'#'*) continue ;; esac
            before=$(gh api "repos/$UPSTREAM/contents/src/$f?ref=$ours"   --jq '.sha' 2>/dev/null || echo '')
            after=$(gh api  "repos/$UPSTREAM/contents/src/$f?ref=$theirs" --jq '.sha' 2>/dev/null || echo '')
            if [ -z "$after" ]; then
              printf 'gone|%s\n' "$f" >> /tmp/verdicts.txt
              collisions=$((collisions + 1))
            elif [ "$before" != "$after" ]; then
              printf 'changed|%s\n' "$f" >> /tmp/verdicts.txt
              collisions=$((collisions + 1))
            else
              printf 'clean|%s\n' "$f" >> /tmp/verdicts.txt
            fi
          done < "$manifest"
          echo "$collisions of $patched patched files collide with $theirs"

          {
            echo "Upstream's latest stable release is \`$theirs\`; this fork ships \`$ours\`."
            echo
            echo "Difference: **$stats**."
            echo
            echo "## Our patches on upstream files"
            echo
            echo "These are the only $patched files this fork changes outside its own"
            echo "additions, from \`$manifest\`. **$collisions of $patched** have to be"
            echo "re-applied by hand -- compared blob by blob, so the count is exact:"
            echo
            while IFS='|' read -r verdict f; do
              case "$verdict" in
                changed) echo "- [ ] \`$f\` — **upstream changed this too**" ;;
                gone)    echo "- [ ] \`$f\` — **upstream removed this file**" ;;
                *)       echo "- [x] \`$f\` — applies cleanly" ;;
              esac
            done < /tmp/verdicts.txt
            echo
            echo "Everything else we add lives in \`Modules/flussonic_1f4a9/\`, \`build/\`"
            echo "and \`.github/\`, which upstream never touches."
            echo
            echo "## Do not use the panel's Update button"
            echo
            echo "It pulls from \`$UPSTREAM\` and \`cp -a\` over the tree, reverting every"
            echo "patch above. Re-sync the fork and publish a release from here instead."
            echo
            echo "See \`build/README.md\` for the procedure."
          } > /tmp/body.md

          gh issue create --title "$title" --body-file /tmp/body.md
          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"
