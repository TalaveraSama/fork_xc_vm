name: Mirror upstream binaries

# Copies the per-distribution runtime tarballs from
# Vateron-Media/XC_VM_Binaries into this repository's releases, so installing
# the panel does not depend on the upstream repository staying available.
#
# This workflow lives in the MIRROR repository, not in the panel repository:
# that way it publishes with the repo's own GITHUB_TOKEN and needs no personal
# access token anywhere.
#
# The release keeps upstream's tag (e.g. 29062026) so bin_version.json still
# records a meaningful version, and is published as "latest" because the
# installer resolves the newest release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to mirror (blank = upstream latest)'
        required: false
        type: string
      force:
        description: 'Re-upload even if this tag is already mirrored'
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 04:00 UTC — picks up new upstream binary builds on its own.
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: mirror-binaries
  cancel-in-progress: false

env:
  UPSTREAM: Vateron-Media/XC_VM_Binaries

jobs:
  mirror:
    name: Mirror release assets
    runs-on: ubuntu-latest

    # Inert in the working repository: here this would publish mirror releases
    # into a private repo nobody can download from. Active in the public fork,
    # which is the whole point of shipping it in the tree.
    if: github.repository != 'TalaveraSama/chunklist-xc_vm'

    steps:
      - name: Resolve the upstream release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          # Prefixed and published as a prerelease: this repository also holds
          # the panel's own releases, and the in-panel updater compares tags
          # with version_compare and only looks at stable ones.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mirror_tag=binaries-$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $tag"
          gh release view "$tag" --repo "$UPSTREAM" \
            --json assets --jq '.assets[] | "  \(.name)  \(.size)"'

      - name: Skip if already mirrored
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
          MIRROR_TAG: ${{ steps.up.outputs.mirror_tag }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          want=$(gh release view "$TAG" --repo "$UPSTREAM" --json assets --jq '[.assets[].name]|sort|join(",")')
          have=$(gh release view "$MIRROR_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|sort|join(",")' 2>/dev/null || echo "")
          if [ "$want" = "$have" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already mirrored — nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download from upstream
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$UPSTREAM" --dir dl
          ls -la dl
          df -h / | tail -1

      # Upstream publishes hashes.md5 next to the tarballs; a mirror that does
      # not check them would happily republish a truncated download.
      - name: Verify checksums
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cd dl
          if [ ! -f hashes.md5 ]; then
            echo "::warning::upstream release has no hashes.md5 — skipping verification"
            exit 0
          fi
          fail=0
          while read -r sum name; do
            [ -n "${name:-}" ] || continue
            if [ ! -f "$name" ]; then
              echo "MISSING  $name"; fail=1; continue
            fi
            actual=$(md5sum "$name" | awk '{print $1}')
            if [ "$actual" = "$sum" ]; then
              echo "OK       $name"
            else
              echo "MISMATCH $name (expected $sum, got $actual)"; fail=1
            fi
          done < hashes.md5
          exit $fail

      - name: Publish to this repository
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
          MIRROR_TAG: ${{ steps.up.outputs.mirror_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$MIRROR_TAG" > /dev/null 2>&1; then
            gh release create "$MIRROR_TAG" \
              --title "XC_VM binaries $TAG" \
              --notes "Mirror of [\`$UPSTREAM\` $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG), verified against its \`hashes.md5\`.

          Published here so panel installs do not depend on the upstream repository. Contents are unmodified." \
              --prerelease
          fi
          gh release upload "$MIRROR_TAG" dl/* --clobber

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
          MIRROR_TAG: ${{ steps.up.outputs.mirror_tag }}
        run: |
          {
            echo "### Mirror of \`$UPSTREAM\` @ \`$TAG\`"
            echo
            gh release view "$MIRROR_TAG" --json assets \
              --jq '.assets[] | "- `\(.name)` — \(.size) bytes"' 2>/dev/null \
              || echo "_no release yet_"
          } >> "$GITHUB_STEP_SUMMARY"
