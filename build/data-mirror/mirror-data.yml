name: Mirror upstream data

# Copies the release assets of one Vateron-Media data repository into this
# one, so the panel can fetch GeoIP databases and the proxy-node archive
# without depending on upstream staying reachable.
#
# One workflow serves both mirrors: upstream is derived from this repository's
# own name, so `TalaveraSama/XC_VM_Update` mirrors `Vateron-Media/XC_VM_Update`
# and `TalaveraSama/XC_VM_Proxy` mirrors `Vateron-Media/XC_VM_Proxy`. Drop the
# same file into either repository.
#
# Like the binaries mirror, this workflow lives in the MIRROR repository, not
# in the panel repository: that way it publishes with the repo's own
# GITHUB_TOKEN and there is no personal access token to create or rotate.
#
# Tags and the stable/prerelease flag are kept EXACTLY as upstream published
# them. That is deliberate. The panel reads these through GitHubReleases,
# which filters by channel and compares tags with PHP's version_compare, so
# a retagged or re-flagged mirror would either be invisible to the panel or
# read as a newer release of something else.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to mirror (blank = upstream latest)'
        required: false
        type: string
      force:
        description: 'Re-upload even if this tag is already mirrored'
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 05:00 UTC, between the binaries mirror and the upstream watcher.
    - cron: '0 5 * * 1'

permissions:
  contents: write

concurrency:
  group: mirror-data
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror release assets
    runs-on: ubuntu-latest

    steps:
      - name: Resolve upstream and the release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Same repository name, upstream owner. Guarded: a mirror created
          # under a different name would otherwise resolve to a repository
          # that does not exist, and the failure would look like a network
          # problem rather than a naming mistake.
          name=${GITHUB_REPOSITORY#*/}
          case "$name" in
            XC_VM_Update|XC_VM_Proxy) ;;
            *)
              echo "::error::this repository is named '$name'; it must be XC_VM_Update or XC_VM_Proxy"
              echo "::error::so that upstream can be derived as Vateron-Media/<name>"
              exit 1
              ;;
          esac
          upstream="Vateron-Media/$name"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$upstream" --json tagName --jq .tagName)
          fi
          [ -n "$tag" ] || { echo "::error::no release found in $upstream"; exit 1; }

          prerelease=$(gh release view "$tag" --repo "$upstream" --json isPrerelease --jq .isPrerelease)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          echo "Mirroring $upstream @ $tag (prerelease=$prerelease)"
          gh release view "$tag" --repo "$upstream" \
            --json assets --jq '.assets[] | "  \(.name)  \(.size)"'

      - name: Skip if already mirrored
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.up.outputs.upstream }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          want=$(gh release view "$TAG" --repo "$UPSTREAM" --json assets --jq '[.assets[].name]|sort|join(",")')
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|sort|join(",")' 2>/dev/null || echo "")
          if [ "$want" = "$have" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already mirrored - nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download from upstream
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.up.outputs.upstream }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$UPSTREAM" --dir dl
          ls -la dl

      # Upstream ships hashes.md5 next to the assets; a mirror that did not
      # check it would happily republish a truncated download.
      - name: Verify checksums
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cd dl
          if [ ! -f hashes.md5 ]; then
            echo "::warning::upstream release has no hashes.md5 - skipping verification"
            exit 0
          fi
          fail=0
          checked=0
          while read -r sum name; do
            [ -n "${name:-}" ] || continue
            if [ ! -f "$name" ]; then
              echo "MISSING  $name"; fail=1; continue
            fi
            actual=$(md5sum "$name" | awk '{print $1}')
            if [ "$actual" = "$sum" ]; then
              echo "OK       $name"; checked=$((checked + 1))
            else
              echo "MISMATCH $name (expected $sum, got $actual)"; fail=1
            fi
          done < hashes.md5
          echo "verified $checked file(s)"
          # A hashes.md5 that matched nothing is a pass that checked nothing.
          [ "$checked" -gt 0 ] || { echo "::error::hashes.md5 listed no file present here"; exit 1; }
          exit $fail

      - name: Publish to this repository
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.up.outputs.upstream }}
          TAG: ${{ steps.up.outputs.tag }}
          PRERELEASE: ${{ steps.up.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Mirror of [\`$UPSTREAM\` $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG), verified against its \`hashes.md5\`.
          Published here so the XC_VM panel does not depend on the upstream repository. Contents, tag and release type are unmodified." \
              $flags
          fi
          gh release upload "$TAG" dl/* --clobber

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.up.outputs.upstream }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          {
            echo "### Mirror of \`$UPSTREAM\` @ \`$TAG\`"
            echo
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "- `\(.name)` - \(.size) bytes"' 2>/dev/null \
              || echo "_no release yet_"
          } >> "$GITHUB_STEP_SUMMARY"
